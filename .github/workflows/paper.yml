# Build paper/main.pdf with a full TeX Live, and check every font is embedded
# (arXiv rejects PDFs with unembedded or Type 3 fonts).
name: paper
on:
  push:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_lualatex: false
          post_compile: "pdffonts main.pdf | tee fonts.txt; ! awk 'NR>2 && ($(NF-4)!=\"yes\" || $0 ~ / Type 3 /)' fonts.txt | grep ."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper
          path: |
            paper/main.pdf
            paper/fonts.txt
