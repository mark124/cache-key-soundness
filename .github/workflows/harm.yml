# Controlled experiment: what happens when a cached virtual environment is
# restored under a key that omits part of what the environment depends on,
# and the workflow skips installation on a cache hit.
#
#   C0  sound key       key carries the full interpreter version (control)
#   E1  minor-only key  seeded on an older 3.12 patch, restored on current 3.12
#   E2  no version      seeded on 3.11, restored on a 3.13 leg
#
# Each run uses keys scoped to its own run id, so runs never share caches.
name: harm
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  POETRY_VERSION: "2.5.1"
  UV_VERSION: "0.12.19"
  UV_PYTHON_DOWNLOADS: never
jobs:
  seed:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        condition: [C0, E1, E2]
        tool: [pip, poetry, uv]
        include:
          - {condition: C0, seed_py: "3.12.10", keyver: full}
          - {condition: E1, seed_py: "3.12.10", keyver: "3.12"}
          - {condition: E2, seed_py: "3.11", keyver: none}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.seed_py }}"}
      - if: matrix.tool == 'uv'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {version: "${{ env.UV_VERSION }}", enable-cache: false}
      - if: matrix.tool == 'poetry'
        run: pipx install "poetry==${POETRY_VERSION}"
      - run: bash scripts/build_env.sh "${{ matrix.tool }}" "${{ steps.py.outputs.python-path }}"
      - name: stamp seed
        run: |
          printf '{"python_version": "%s", "python_path": "%s", "image_version": "%s"}\n' \
            "${{ steps.py.outputs.python-version }}" "${{ steps.py.outputs.python-path }}" "$ImageVersion" \
            > fixture/.venv/.seedinfo.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixture/.venv
          key: exp-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.condition }}-${{ matrix.tool }}-${{ matrix.keyver == 'full' && steps.py.outputs.python-version || matrix.keyver }}

  restore:
    needs: seed
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        condition: [C0, E1, E2]
        tool: [pip, poetry, uv]
        include:
          - {condition: C0, leg_py: "3.12", keyver: full}
          - {condition: E1, leg_py: "3.12", keyver: "3.12"}
          - {condition: E2, leg_py: "3.13", keyver: none}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.leg_py }}"}
      - if: matrix.tool == 'uv'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {version: "${{ env.UV_VERSION }}", enable-cache: false}
      - if: matrix.tool == 'poetry'
        run: pipx install "poetry==${POETRY_VERSION}"
      - id: key
        run: echo "key=exp-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.condition }}-${{ matrix.tool }}-${{ matrix.keyver == 'full' && steps.py.outputs.python-version || matrix.keyver }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixture/.venv
          key: ${{ steps.key.outputs.key }}
      # The pattern under study: skip installation whenever the key matched.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build_env.sh "${{ matrix.tool }}" "${{ steps.py.outputs.python-path }}"
      - name: test (outcome recorded, never fails the job)
        env:
          CONDITION: ${{ matrix.condition }}
          TOOL: ${{ matrix.tool }}
          CACHE_KEY: ${{ steps.key.outputs.key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          LEG_REQUESTED: ${{ matrix.leg_py }}
          LEG_ACTUAL: ${{ steps.py.outputs.python-version }}
          PROBE_OUT: ${{ github.workspace }}/probe.json
        run: |
          set +e
          bash scripts/run_workload.sh "${{ matrix.tool }}" > workload.log 2>&1
          rc=$?
          cat workload.log
          /usr/bin/python3 scripts/record_outcome.py "outcome-${{ matrix.condition }}-${{ matrix.tool }}.json" "$rc" workload.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outcome-${{ matrix.condition }}-${{ matrix.tool }}
          path: outcome-${{ matrix.condition }}-${{ matrix.tool }}.json
